services:
  library:
    image: zhixuan-library:latest
    container_name: zhixuan-library
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:6870:3000"
    volumes:
      - ./data:/app/data
      - ./novels:/data/novels:ro
      - ./covers:/app/public/covers:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

