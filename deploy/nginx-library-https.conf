limit_req_zone $binary_remote_addr zone=zhixuan_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name library.aivideoart.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name library.aivideoart.cn;

    ssl_certificate /etc/letsencrypt/live/library.aivideoart.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.aivideoart.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location = /api/auth/callback/credentials {
        limit_req zone=zhixuan_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:6870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:6870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

